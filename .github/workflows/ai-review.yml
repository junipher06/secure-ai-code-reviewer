name: Secure AI Code Reviewer
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ai_review:
    name: AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted base implementation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install trusted base reviewer
        run: python -m pip install .
      - name: Review diff via GitHub API and post findings
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m reviewer.cli --event "$GITHUB_EVENT_PATH" --post-comment
  ci_checks:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out PR code for isolated tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies without Groq secret
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Unit and security boundary tests
        run: python -m unittest discover -s tests -v
      - name: Static security scan
        run: python -m bandit -r src -ll
  gate:
    name: AI Review Gate
    needs: [ai_review, ci_checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all checks to succeed
        env:
          AI_RESULT: ${{ needs.ai_review.result }}
          CI_RESULT: ${{ needs.ci_checks.result }}
        run: |
          if [ "$AI_RESULT" != "success" ] || [ "$CI_RESULT" != "success" ]; then
            echo "FAIL: AI review or CI failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "PASS: AI review and CI completed successfully."
