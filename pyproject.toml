[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"
[project]
name = "secure-ai-code-reviewer"
version = "0.1.0"
description = "Section 2 course project: a constrained Groq PR reviewer"
requires-python = ">=3.11"
dependencies = ["groq>=0.31,<2", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "mypy>=1.15,<2", "bandit>=1.8,<2", "PyYAML>=6,<7", "types-jsonschema>=4.23,<5"]
[project.scripts]
ai-review = "reviewer.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
